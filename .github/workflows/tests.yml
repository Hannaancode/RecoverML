name: Correctness and smoke benchmark
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'results/**'
      - '**.md'
      - 'reproducibility.txt'
      - 'CHECKSUMS*.json'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'results/**'
      - '**.md'
      - 'reproducibility.txt'
      - 'CHECKSUMS*.json'
jobs:
  scientific-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e '.[paper]'
      - run: |
          mkdir -p work/cloud_metadata
          uname -a > work/cloud_metadata/uname.txt
          lscpu > work/cloud_metadata/lscpu.txt
          python -m pip freeze > work/cloud_metadata/packages.txt
          python -m pip check > work/cloud_metadata/pip_check.txt
          git rev-parse HEAD > work/cloud_metadata/commit.txt
          python -c 'import json; from recoverml.core import environment; print(json.dumps(environment(), indent=2))' > work/cloud_metadata/environment.json
      - run: python -m recoverml.scientific_benchmarks --protocol configs/scientific_ci_oct15.json --output work/ci_scientific --hyppo-cache work/pinned_hyppo
      - run: python scripts/analyze_scientific_audit.py work/ci_scientific
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-cloud-scientific-reproduction
          path: |
            work/ci_scientific
            work/cloud_metadata
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e '.[paper]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_release.py --output work/release_integrity.json
      - name: Recheck complete published strongest-baseline evidence
        run: |
          PYTHONPATH=src python scripts/audit_cloud_followup.py results/research/strong_baseline_cloud_oct16 --source-commit 00bd37a8addd6cea919edf2189c3246811bb669e --output work/complete_cloud_audit.json
          PYTHONPATH=src python scripts/audit_native_frontier.py results/research/native_frontier_cloud_oct16/v4 --source-commit f00981ea84357199f0bde6916a5536684b1ed567 --output work/complete_native_audit.json
          PYTHONPATH=src python scripts/audit_planner_efficiency_release.py results/research/planner_efficiency_oct26 --output work/complete_planner_audit.json
      - run: recoverml benchmark --config configs/smoke.json --out work/ci_smoke
      - run: python -m recoverml.audit work/ci_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-execution-evidence
          path: |
            work/ci_smoke
            work/release_integrity.json
            work/complete_cloud_audit.json
            work/complete_native_audit.json
            work/complete_planner_audit.json
  neural-and-controls:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e '.[paper]'
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -v
      - run: python -m recoverml.boundary_controls --config configs/boundary_controls_oct13.json --out work/ci_boundary_controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neural-tests-and-boundary-controls
          path: work/ci_boundary_controls
