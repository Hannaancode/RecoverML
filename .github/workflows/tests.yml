name: Correctness and smoke benchmark
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: recoverml benchmark --config configs/smoke.json --out work/ci_smoke
      - run: python -m recoverml.audit work/ci_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-execution-evidence
          path: work/ci_smoke
