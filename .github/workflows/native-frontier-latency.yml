name: Native frontier paired latency
# Baseline v2 avoids an unnecessary deserialize of newly computed DVC values.
on:
  push:
    branches: ['research/scientific-validation-oct15']
    paths: ['.github/workflows/native-frontier-latency.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    name: Native paired seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [20261016, 20261017, 20261018]
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install -e '.[paper]'
          python -m pip check
      - name: Record environment
        run: |
          mkdir -p work/native_metadata
          git rev-parse HEAD > work/native_metadata/commit.txt
          python -m pip freeze > work/native_metadata/packages.txt
          lscpu > work/native_metadata/lscpu.txt
      - name: Native paired recovery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('configs/native_frontier_latency_oct16.json').read_text())
          config.update(datasets=['wine'], versions=[16], concat_materialized=[False], repetitions=1,
                        purpose='Untimed acceptance smoke; excluded from the fixed-grid results')
          Path('work/native_smoke_protocol.json').write_text(json.dumps(config, indent=2)+'\n')
          PY
          python scripts/benchmark_native_frontier.py --protocol work/native_smoke_protocol.json --output work/native_smoke --seed ${{ matrix.seed }}
      - name: Full fixed native recovery grid
        run: python scripts/benchmark_native_frontier.py --output work/native_paired --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-paired-seed-${{ matrix.seed }}
          retention-days: 90
          if-no-files-found: error
          path: |
            work/native_paired
            work/native_metadata
            work/native_smoke
            work/native_smoke_protocol.json
