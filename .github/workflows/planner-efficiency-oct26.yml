name: Paired planner efficiency October 26
on:
  push:
    branches: ['research/scientific-validation-oct15']
    paths: ['.github/workflows/planner-efficiency-oct26.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    name: Full planner comparison - ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [scientific, cloud, retinal, letter, scaling]
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e '.[paper]'
      - name: Run the complete fixed comparison group
        run: python scripts/benchmark_planner_efficiency.py --group ${{ matrix.group }} --output work/planner_comparison
      - name: Independently reconcile every timing and retained set
        run: python scripts/audit_planner_efficiency.py work/planner_comparison --output work/audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planner-efficiency-${{ matrix.group }}
          retention-days: 90
          if-no-files-found: error
          path: |
            work/planner_comparison
            work/audit.json
