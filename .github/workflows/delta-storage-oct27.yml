name: Coupled delta storage on every saved condition
# Revision 2 repairs duplicate representations in heuristic plans; full grid unchanged.
on:
  push:
    branches: ['research/scientific-validation-oct15']
    paths: ['.github/workflows/delta-storage-oct27.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:tests
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e '.[paper]'
      - run: python -m unittest test_delta_store test_encoded_store -v
      - run: python scripts/materialize_encoded_storage.py results/research/encoded_storage_oct26 --output work/originals
      - run: python scripts/benchmark_delta_storage.py --originals work/originals --block primary/iris/standard_linear --output work/acceptance
      - run: python scripts/audit_delta_storage.py work/acceptance --originals work/originals --output work/acceptance_audit.json
      - run: python scripts/benchmark_delta_storage.py --originals work/originals --block primary/breast_cancer/pca_neighbors --output work/pca_acceptance
      - run: python scripts/audit_delta_storage.py work/pca_acceptance --originals work/originals --output work/pca_acceptance_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-storage-acceptance
          path: |
            work/acceptance/*.json
            work/acceptance/*.gz
            work/acceptance/failure.txt
            work/acceptance_audit.json
            work/pca_acceptance/*.json
            work/pca_acceptance/*.gz
            work/pca_acceptance/failure.txt
            work/pca_acceptance_audit.json
          retention-days: 90
  census:
    needs: acceptance
    name: Delta ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - block: primary/iris/standard_linear
            name: primary-iris-standard_linear
          - block: primary/iris/pca_neighbors
            name: primary-iris-pca_neighbors
          - block: primary/iris/minmax_tree
            name: primary-iris-minmax_tree
          - block: primary/iris/robust_forest
            name: primary-iris-robust_forest
          - block: primary/wine/standard_linear
            name: primary-wine-standard_linear
          - block: primary/wine/pca_neighbors
            name: primary-wine-pca_neighbors
          - block: primary/wine/minmax_tree
            name: primary-wine-minmax_tree
          - block: primary/wine/robust_forest
            name: primary-wine-robust_forest
          - block: primary/breast_cancer/standard_linear
            name: primary-breast_cancer-standard_linear
          - block: primary/breast_cancer/pca_neighbors
            name: primary-breast_cancer-pca_neighbors
          - block: primary/breast_cancer/minmax_tree
            name: primary-breast_cancer-minmax_tree
          - block: primary/breast_cancer/robust_forest
            name: primary-breast_cancer-robust_forest
          - block: primary/digits/standard_linear
            name: primary-digits-standard_linear
          - block: primary/digits/pca_neighbors
            name: primary-digits-pca_neighbors
          - block: primary/digits/minmax_tree
            name: primary-digits-minmax_tree
          - block: primary/digits/robust_forest
            name: primary-digits-robust_forest
          - block: primary/diabetes/standard_linear
            name: primary-diabetes-standard_linear
          - block: primary/diabetes/pca_neighbors
            name: primary-diabetes-pca_neighbors
          - block: primary/diabetes/minmax_tree
            name: primary-diabetes-minmax_tree
          - block: primary/diabetes/robust_forest
            name: primary-diabetes-robust_forest
          - block: primary/linnerud/standard_linear
            name: primary-linnerud-standard_linear
          - block: primary/linnerud/pca_neighbors
            name: primary-linnerud-pca_neighbors
          - block: primary/linnerud/minmax_tree
            name: primary-linnerud-minmax_tree
          - block: primary/linnerud/robust_forest
            name: primary-linnerud-robust_forest
          - block: transfer/scientific
            name: transfer-scientific
          - block: transfer/cloud
            name: transfer-cloud
          - block: transfer/retinal
            name: transfer-retinal
          - block: transfer/letter
            name: transfer-letter
    env:
      PYTHONPATH: src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e '.[paper]'
      - run: python scripts/materialize_encoded_storage.py results/research/encoded_storage_oct26 --output work/originals
      - run: python scripts/benchmark_delta_storage.py --originals work/originals --block ${{ matrix.block }} --output work/delta
      - run: python scripts/audit_delta_storage.py work/delta --originals work/originals --output work/delta_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-storage-${{ matrix.name }}
          path: |
            work/delta/*.json
            work/delta/*.gz
            work/delta/failure.txt
            work/delta_audit.json
          retention-days: 90
